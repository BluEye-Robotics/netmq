name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/NetMQ.Tests/NetMQ.Tests.csproj -c Release /p:TargetFrameworks=net10.0
      - name: Test
        # ClassName is not a filter property the xunit adapter supports, so the
        # previous ClassName!= filter excluded nothing and Beacon/Pgm tests ran
        # anyway; FullyQualifiedName!~ is the xunit-supported way to exclude them.
        run: dotnet test src/NetMQ.Tests/NetMQ.Tests.csproj -c Release --no-build /p:TargetFrameworks=net10.0 -p:ParallelizeTestCollections=false --filter "FullyQualifiedName!~BeaconTests&FullyQualifiedName!~PgmTests"
